name: asset-studio-native-inspect
on:
  push:
    branches: [feat/urban-external-assets-20260919]
    paths: ['tools/asset_studio/inspect_native.py', '.github/workflows/asset-studio-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install bpy==5.1.2
      - name: Reuse verified acquisition jobs instead of redownloading source assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 35386939547 -n reviewed-external-assets -D runs/assets
          gh run download 35388104419 -n reviewed-business-avatars -D runs/people
      - run: python tools/asset_studio/inspect_native.py --assets runs/assets --people runs/people --out runs/inspect
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-import-inspection
          path: runs/inspect
          if-no-files-found: error
          retention-days: 7
