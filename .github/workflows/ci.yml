name: offline-validation
on:
  push:
    branches: [main, feat/public-world-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Windows locale without forced UTF-8
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: '0'
        run: python -m pytest -q --junitxml=reports/pytest-native-locale.xml
      - run: python -m compileall -q src tools
      - run: python tools/check_repository.py
      - run: python -m jevdrive build-world
      - run: python tools/run_smoke.py
      - run: python tools/build_viewer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            reports/pytest.xml
            reports/pytest-native-locale.xml
            reports/smoke_summary.json
            world/BUILD_REPORT.json
            web/index.html
          retention-days: 14
