name: real-public-data-ego-stills
on:
  push:
    branches: [feat/ego-public-world]
    paths: ['.github/workflows/ego-still.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ego-still-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-stills:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JEVDRIVE_DECODE_GEOMETRY: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: npm install --ignore-scripts --no-audit --no-fund --prefix tools/gltf
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender ffmpeg fonts-dejavu-core
      - name: Real-data still preview, two nearby forward camera positions
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.prepare_ego_capture import prepare
          from jevdrive.egoview import CameraSpec
          prepare(Path('configs/tokyo-ego.json'), Path('runs/ego-still'), CameraSpec(fps=1,seconds=2))
          PY
      - run: blender --background --threads 2 --python-exit-code 2 --python tools/blender_ego_capture.py -- --capture runs/ego-still
      - run: python tools/encode_ego_capture.py runs/ego-still
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tokyo-ego-stills
          path: |
            runs/ego-still/delivery/
            runs/ego-still/render-evidence.json
            runs/ego-still/capture.json
            runs/ego-still/source/public-world.json
          retention-days: 14
