name: real-public-data-ego-view
on:
  push:
    branches: [feat/ego-public-world]
    paths:
      - "src/jevdrive/egoview.py"
      - "src/jevdrive/publicworld/**"
      - "configs/tokyo-ego.json"
      - "tools/*ego_capture.py"
      - "docs/EGO_DATA_LICENSES.md"
      - ".github/workflows/ego-view.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ego-view-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JEVDRIVE_DECODE_GEOMETRY: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: npm install --ignore-scripts --no-audit --no-fund --prefix tools/gltf
      - name: Install real Blender and video encoder
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender ffmpeg fonts-dejavu-core
      - name: Acquire real data, add street-level layers, plan ego-camera path
        run: python tools/prepare_ego_capture.py --config configs/tokyo-ego.json --out runs/ego
      - name: Execute Blender camera rendering
        run: blender --background --threads 2 --python-exit-code 2 --python tools/blender_ego_capture.py -- --capture runs/ego
      - name: Encode and verify real rendered frames
        run: python tools/encode_ego_capture.py runs/ego
      - name: Upload attributed derived renders, not raw world databases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tokyo-ego-camera
          path: |
            runs/ego/delivery/
            runs/ego/render-evidence.json
            runs/ego/capture.json
            runs/ego/source/public-world.json
            runs/ego/source/download-lock.json
            runs/ego/layers/*/download-lock.json
          if-no-files-found: warn
          retention-days: 14
