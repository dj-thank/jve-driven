name: hero-library-export
on:
  push:
    branches: [feat/hero-assets-cloud-20260918]
    paths: ['tools/export_hero_library.py', '.github/workflows/hero-library.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Verify and unpack official Blender
        run: |
          mkdir -p /tmp/hero-blender
          cd /tmp/hero-blender
          curl -fL --retry 2 --max-time 180 -O https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz
          curl -fL --max-time 30 -O https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256
          grep 'blender-4.5.3-linux-x64.tar.xz' blender-4.5.3.sha256 | sha256sum --check
          tar -xf blender-4.5.3-linux-x64.tar.xz
          echo '/tmp/hero-blender/blender-4.5.3-linux-x64' >> "$GITHUB_PATH"
      - run: python tools/hero_assets_fetch.py --out runs/hero-assets
      - run: blender --background --factory-startup --disable-autoexec --threads 4 --python-exit-code 2 --python tools/export_hero_library.py -- --assets runs/hero-assets --out runs/hero-library
      - name: Preserve reusable models independently of render completion
        if: always()
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          if Path('runs/hero-library').is_dir(): shutil.make_archive('runs/hero-library', 'zip', 'runs/hero-library')
          if Path('runs/hero-assets').is_dir(): shutil.make_archive('runs/hero-source-assets', 'zip', 'runs/hero-assets')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hero-library-and-sources
          path: |
            runs/hero-library.zip
            runs/hero-source-assets.zip
          if-no-files-found: error
          retention-days: 14
