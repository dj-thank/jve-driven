name: public-world-live-check
on:
  push:
    branches: [feat/public-world-foundation]
    paths:
      - 'src/jevdrive/publicworld/**'
      - 'configs/**'
      - 'tools/live_world_check.py'
      - 'tools/gltf/**'
      - 'tools/check_decoder.py'
      - '.github/workflows/public-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-world-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JEVDRIVE_DECODE_GEOMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Install exact geometry decoder dependencies (no lifecycle scripts)
        run: npm install --ignore-scripts --no-audit --no-fund --prefix tools/gltf
      - name: Validate actual Draco round-trip on synthetic textured geometry
        run: python tools/check_decoder.py
      - name: Acquire real public data (120 MB / 180 resources maximum)
        run: python tools/live_world_check.py --config configs/tokyo-smoke.json --out runs/public-smoke
      - name: Preserve diagnostics, never publish unreviewed imagery or meshes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-world-evidence
          path: |
            runs/public-smoke-live-check.json
            runs/public-smoke/public-world.json
            runs/public-smoke/download-lock.json
            runs/public-smoke/source-lock.json
            runs/public-smoke/visual-audit.json
          if-no-files-found: error
          retention-days: 14
