name: Urban render contracts
on:
  push:
    branches: [feat/urban-asset-upgrade-20260919]
    paths: [experiments/urban-render/**, .github/workflows/urban-render-contract.yml]
  pull_request:
    paths: [experiments/urban-render/**, .github/workflows/urban-render-contract.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Preserve repository baseline
        run: python -m pytest -q
      - name: Native playback contracts
        working-directory: experiments/urban-render
        run: python -m pytest -q && python -m compileall -q urban_district tools
