name: Urban surface intake
on:
  push:
    branches: [feat/urban-asset-upgrade-20260919]
    paths: [.github/workflows/urban-surface-intake.yml]
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download two public CC0 surface sets
        shell: python
        run: |
          import hashlib,json,pathlib,time,urllib.request,urllib.parse
          root=pathlib.Path('surface-intake');root.mkdir()
          report={'schema':'urban.asset-intake.v1','files':[],'errors':[],'purchases':0};total=0
          def fetch(url,path,md5=None):
              global total
              if urllib.parse.urlsplit(url).hostname not in {'api.polyhaven.com','dl.polyhaven.org'}:raise ValueError('Unexpected source')
              req=urllib.request.Request(url,headers={'User-Agent':'JveDriven-SurfaceReview/0.7 (dj-thank/jve-driven)'})
              with urllib.request.urlopen(req,timeout=60) as r:b=r.read(30_000_001)
              if len(b)>30_000_000 or total+len(b)>120_000_000:raise ValueError('Budget exceeded')
              if md5 and hashlib.md5(b).hexdigest()!=md5:raise ValueError('Provider checksum mismatch')
              total+=len(b);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(b)
              report['files'].append({'path':str(path.relative_to(root)),'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'provider_md5':md5})
              return b
          for asset in ['patterned_paving','floor_pavement']:
              try:
                  data=json.loads(fetch('https://api.polyhaven.com/files/'+asset,root/asset/'catalog.json'))
                  fetch('https://api.polyhaven.com/info/'+asset,root/asset/'info.json')
                  for channel,provider_key in [('diff','Diffuse'),('nor_gl','nor_gl'),('arm','arm')]:
                      entry=data[provider_key]['2k'].get('png') or data[provider_key]['2k']['jpg']
                      ext=pathlib.PurePosixPath(urllib.parse.urlsplit(entry['url']).path).suffix
                      fetch(entry['url'],root/asset/(channel+ext),entry.get('md5'))
              except Exception as e:report['errors'].append({'asset':asset,'error':str(e)})
          report['total_bytes']=total;report['completed_utc']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          (root/'intake.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if report['errors']:raise RuntimeError('Surface acquisition incomplete')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: urban-surface-intake
          path: surface-intake
          retention-days: 7
          if-no-files-found: error
